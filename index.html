<style>
:root{
  --page:#E9E5DD;
  --bg:#FBF8F1; --ink:#3D332C; --muted:#8C8278; --accent:#7D865E; --accent2:#E8E3D2; --surface:#FFFFFF; --line:#E6E0D3;
  --film:#3D332C; --film-hole:rgba(251,248,241,.82);
  --head:"Noto Serif KR","Apple Myungjo",Georgia,serif;
  --body:"Gowun Batang","Noto Serif KR",serif;
  --script:"Pinyon Script",cursive;
  --ui:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  --radius:14px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--page)}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.75;-webkit-font-smoothing:antialiased;padding-inline:0;padding-block:0}
@media (min-width:480px){body{padding-block:28px 48px;padding-inline:16px}}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
.inv{max-width:430px;margin:0 auto;background:var(--bg);position:relative;overflow:hidden}
@media (min-width:480px){.inv{border-radius:28px;box-shadow:0 30px 70px -30px rgba(61,51,44,.45)}}
.err{padding:80px 28px;text-align:center;font-family:var(--ui);font-size:14px;line-height:1.8}

/* cover */
.cover{position:relative;width:100%;height:100svh;min-height:600px;max-width:100%;overflow:hidden;background:#D9D2C3}
@supports not (height:100svh){.cover{height:100vh}}
@media (min-width:480px){.cover{height:auto;min-height:0;aspect-ratio:9/17.5}}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:48% 45%;display:block}
.cover .topo{position:absolute;top:calc(env(safe-area-inset-top,0px) + 64px);left:0;right:0;text-align:center;color:var(--ink);padding:0 16px}
.cover .scr{font-family:var(--script);font-size:clamp(34px,10vw,42px);line-height:1;text-shadow:0 1px 0 rgba(255,255,255,.65),0 0 18px rgba(255,255,255,.5)}
.cover .eb{margin-top:10px;opacity:.78}
.cover .ov{position:absolute;inset:auto 0 0 0;padding:160px 24px calc(40px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--ink);background:linear-gradient(180deg,rgba(251,248,241,0) 0%,rgba(251,248,241,.55) 40%,rgba(251,248,241,.96) 78%,var(--bg) 100%)}
.cover .nm{font-family:var(--head);font-size:27px;font-weight:600;letter-spacing:.1em}
.cover .nm i{font-style:normal;color:var(--accent);font-size:16px;margin:0 10px;vertical-align:middle}
.cover .dt{font-family:var(--head);font-size:12.5px;letter-spacing:.2em;margin-top:12px}
.cover .vn{font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:.04em}
.bgm{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:max(14px,calc(50vw - 215px + 14px));z-index:30;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(61,51,44,.22);box-shadow:0 2px 10px rgba(61,51,44,.12);display:grid;place-items:center;color:var(--ink);cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
@media (min-width:480px){.bgm{top:42px}}
.bgm:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bgm .eq{display:flex;align-items:flex-end;gap:2.5px;height:14px}
.bgm .eq i{width:2.5px;height:100%;background:currentColor;border-radius:1px;transform-origin:50% 100%;transform:scaleY(.28)}
.bgm.on{color:var(--accent)}
.bgm.on .eq i{animation:eq 1.1s ease-in-out infinite}
.bgm.on .eq i:nth-child(2){animation-delay:-.4s}
.bgm.on .eq i:nth-child(3){animation-delay:-.75s}
.bgm.on .eq i:nth-child(4){animation-delay:-.2s}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.bgm:not(.on)::after{content:"";position:absolute;left:50%;top:50%;width:24px;height:1.5px;margin:-.75px 0 0 -12px;background:currentColor;border-radius:1px;transform:rotate(-45deg)}
@media (prefers-reduced-motion:reduce){.bgm.on .eq i{animation:none}.bgm.on .eq i:nth-child(1){transform:scaleY(.5)}.bgm.on .eq i:nth-child(2){transform:scaleY(1)}.bgm.on .eq i:nth-child(3){transform:scaleY(.7)}.bgm.on .eq i:nth-child(4){transform:scaleY(.4)}}
.down{position:absolute;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);color:var(--muted);font-size:12px;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,5px)}}
@media (prefers-reduced-motion:reduce){.down{animation:none}}

/* entry: viewfinder gate, then backlit sunlight from the right */
/* until the shutter is pressed there is nothing below the first screen to scroll to */
html.gated .inv>:not(.cover){display:none}
html.gated,html.gated body{overscroll-behavior:none}
@media (max-width:479px){html.gated,html.gated body{overflow:hidden}html.gated .cover{min-height:0}}
.bgm{transition:opacity .6s ease}
html.gated .bgm{opacity:0;pointer-events:none}
.cover.sunup .topo,.cover.sunup .ov{transition:opacity 1.4s ease 1s}
.cover.gated:not(.sunup) .topo,.cover.gated:not(.sunup) .ov,.cover.gated .down{opacity:0}
.cover.gated img{transform:scale(1.08)}
.cover.gated.sunup img{transform:none;transition:transform 3.2s cubic-bezier(.2,.6,.2,1);animation:expose 2.6s ease-out both}
@keyframes expose{0%{filter:brightness(1.45) contrast(.9) saturate(.85)}100%{filter:brightness(1) contrast(1) saturate(1)}}
.gate,.sunl{position:absolute;left:0;right:0;top:0;height:100svh}
@supports not (height:100svh){.gate,.sunl{height:100vh}}
@media (min-width:480px){.gate,.sunl{height:100%}}
.gate{background:rgba(31,26,23,.46);-webkit-backdrop-filter:blur(8px) saturate(.75);backdrop-filter:blur(8px) saturate(.75);color:rgba(251,248,241,.88);font-family:var(--ui);text-align:center;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;transition:opacity .7s ease .1s,backdrop-filter .5s ease,-webkit-backdrop-filter .5s ease,background-color .5s ease}
.cover.focus .gate{-webkit-backdrop-filter:blur(0) saturate(1);backdrop-filter:blur(0) saturate(1);background:rgba(31,26,23,.2)}
.cover.sunup .gate{opacity:0;pointer-events:none}
.gate .hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 26px);font-size:11px;letter-spacing:.14em;font-weight:500}
.gate .tl{left:30px}.gate .tr{right:30px;display:flex;align-items:center;gap:7px}
.gate .bat{width:22px;height:11px;border:1px solid currentColor;border-radius:2px;position:relative;padding:1px}
.gate .bat::before{content:"";display:block;width:70%;height:100%;background:currentColor}
.gate .bat::after{content:"";position:absolute;right:-4px;top:2px;width:2px;height:5px;background:currentColor}
.gate .br{position:absolute;width:32px;height:32px;border:1.5px solid currentColor}
.gate .b1{left:22px;top:calc(env(safe-area-inset-top,0px) + 62px);border-right:0;border-bottom:0}.gate .b2{right:22px;top:calc(env(safe-area-inset-top,0px) + 62px);border-left:0;border-bottom:0}
.gate .b3{left:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 188px);border-right:0;border-top:0}.gate .b4{right:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 188px);border-left:0;border-top:0}
.gate .fbox{position:absolute;left:50%;top:38%;width:116px;height:116px;margin:-58px 0 0 -58px;border:1.5px solid currentColor;border-radius:3px;transition:transform .35s cubic-bezier(.3,1.6,.5,1),border-color .2s}
.gate .fbox::before,.gate .fbox::after{content:"";position:absolute;background:currentColor;left:50%;top:50%}
.gate .fbox::before{width:11px;height:1px;margin:-.5px 0 0 -5.5px}.gate .fbox::after{width:1px;height:11px;margin:-5.5px 0 0 -.5px}
.cover.focus .gate .fbox{transform:scale(.78);border-color:#B9D48A}
.gate .txt{position:absolute;left:0;right:0;top:55%;padding:0 24px;transition:opacity .3s}
.gate .gnm{font-family:var(--head);font-size:24px;font-weight:600;letter-spacing:.1em;color:#FBF8F1;text-shadow:0 1px 10px rgba(0,0,0,.35)}
.gate .gnm i{font-style:normal;color:#D5DDB8;font-size:15px;margin:0 9px;vertical-align:middle}
.gate .gdt{font-family:var(--head);font-size:12px;letter-spacing:.22em;margin-top:9px}
.cover.focus .gate .txt{opacity:0}
.gate .expo{position:absolute;left:30px;right:30px;bottom:calc(env(safe-area-inset-bottom,0px) + 154px);display:flex;justify-content:space-between;font-size:11px;letter-spacing:.1em;font-variant-numeric:tabular-nums}
.gate .act{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 34px)}
.gate .go{width:72px;height:72px;border-radius:50%;border:3px solid #FBF8F1;background:transparent;padding:5px;display:inline-grid;cursor:pointer;-webkit-tap-highlight-color:transparent;animation:ring 2.2s ease-in-out infinite}
.gate .go::before{content:"";border-radius:50%;background:#FBF8F1;transition:transform .12s}
.gate .go:focus-visible{outline:2px solid #FBF8F1;outline-offset:4px}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(251,248,241,.45)}60%{box-shadow:0 0 0 14px rgba(251,248,241,0)}}
.cover.focus .gate .go{animation:none}
.cover.focus .gate .go::before{transform:scale(.82)}
.gate .hint{margin-top:10px;font-size:12px;letter-spacing:.04em}
.gate .blade{position:absolute;left:0;right:0;height:51%;background:#1F1A17;z-index:5}
.gate .blade.t{top:0;transform:translateY(-101%)}.gate .blade.b{bottom:0;transform:translateY(101%)}
.cover.snap .gate .blade{animation:blade .34s cubic-bezier(.5,0,.5,1)}
@keyframes blade{45%,60%{transform:none}}
.sunl{pointer-events:none;overflow:hidden}
.sunl i{position:absolute;display:block;opacity:0;mix-blend-mode:screen;will-change:transform,opacity}
.sunl .src{right:-58%;top:-24%;width:116%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,252,238,.95) 0,rgba(255,232,176,.7) 16%,rgba(255,208,130,.3) 40%,rgba(255,200,120,0) 68%);filter:blur(6px)}
.sunl .shaft{inset:-10%;background:conic-gradient(from 180deg at 104% 12%,rgba(255,240,205,0) 0deg,rgba(255,240,205,.5) 13deg,rgba(255,240,205,.08) 21deg,rgba(255,240,205,.34) 29deg,rgba(255,240,205,0) 35deg,rgba(255,240,205,.62) 45deg,rgba(255,240,205,.2) 56deg,rgba(255,240,205,.46) 63deg,rgba(255,240,205,0) 71deg,rgba(255,240,205,.3) 78deg,rgba(255,240,205,0) 88deg,rgba(255,240,205,0) 360deg);-webkit-mask:radial-gradient(circle at 100% 14%,#000 0,rgba(0,0,0,.75) 35%,rgba(0,0,0,.25) 68%,transparent 92%);mask:radial-gradient(circle at 100% 14%,#000 0,rgba(0,0,0,.75) 35%,rgba(0,0,0,.25) 68%,transparent 92%);filter:blur(9px);transform-origin:95% 18%}
.sunl .shaft.two{filter:blur(16px);transform:rotate(-6deg)}
.sunl .haze{inset:0;background:linear-gradient(250deg,rgba(255,230,180,.6) 0%,rgba(255,226,170,.22) 40%,rgba(255,226,170,0) 78%)}
.sunl .m{border-radius:50%;left:var(--x);top:var(--y);width:var(--d);height:var(--d);background:rgba(255,246,220,.95);filter:blur(var(--b))}
.cover.sunup .sunl .src{animation:sunsrc 3.6s ease-out forwards}
.cover.sunup .sunl .shaft{animation:shaft 3.6s ease-in-out forwards}
.cover.sunup .sunl .shaft.two{animation:shaft2 3.6s ease-in-out forwards}
.cover.sunup .sunl .haze{animation:haze 3.6s ease-out forwards}
.cover.sunup .sunl .m{animation:mote var(--t) ease-in-out var(--w) forwards}
@keyframes sunsrc{0%{opacity:0;transform:scale(.85)}20%{opacity:1}65%{opacity:.85}100%{opacity:0;transform:scale(1.05)}}
@keyframes shaft{0%{opacity:0;transform:rotate(3deg)}25%{opacity:.95}65%{opacity:.8}100%{opacity:0;transform:rotate(-2deg)}}
@keyframes shaft2{0%{opacity:0;transform:rotate(-9deg)}30%{opacity:.8}100%{opacity:0;transform:rotate(-3deg)}}
@keyframes haze{0%{opacity:0}16%{opacity:1}55%{opacity:.7}100%{opacity:0}}
@keyframes mote{0%{opacity:0;transform:translate(0,0)}30%{opacity:var(--o)}100%{opacity:0;transform:translate(var(--mx),var(--my))}}
@media (prefers-reduced-motion:reduce){.gate .go{animation:none}.cover.gated img{transform:none}.cover.gated.sunup img,.cover.sunup .sunl i{animation:none;transition:none}}

/* sections */
.sec{padding:52px 24px}
.sec+.sec{border-top:1px solid var(--line)}
.eb{font-family:var(--head);font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--accent);text-align:center;margin-bottom:14px}
.ttl{font-family:var(--head);font-size:19px;font-weight:600;text-align:center;margin-bottom:20px}
.p{text-align:center;white-space:pre-line;font-size:14px;line-height:2}
.quote{font-family:var(--head);font-size:12.5px;color:var(--accent);text-align:center;line-height:1.9;margin-bottom:18px;white-space:pre-line}
.quote small{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.1em;margin-top:4px}

/* couple */
.couple{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start;text-align:center}
.couple .yp{width:88px;height:88px;border-radius:50%;margin:0 auto 12px;object-fit:cover;display:block;background:var(--accent2);box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--accent2)}
.couple .who{font-family:var(--head);font-size:10.5px;letter-spacing:.3em;color:var(--accent);margin-bottom:8px}
.couple .nm{font-family:var(--head);font-size:17px;font-weight:600}
.couple .par{font-size:12px;color:var(--muted);margin:4px 0 10px;line-height:1.6;word-break:keep-all}
.couple .tag{font-size:12px;line-height:1.7;white-space:pre-line}
.couple .amp{font-family:var(--script);font-size:26px;color:var(--accent);padding-top:30px}

/* calendar + d-day */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 0;text-align:center;font-size:12.5px;margin:6px 0 0;font-variant-numeric:tabular-nums;font-family:var(--head)}
.cal b{font-weight:500;font-size:10.5px;letter-spacing:.1em;color:var(--muted);padding-bottom:8px}
.cal b:first-child,.cal .sun{color:#C48B86}
.cal b:nth-child(7),.cal .sat{color:#8C9FB7}
.cal i{font-style:normal;height:30px;line-height:30px;display:block}
.cal i.on{background:var(--accent);color:#fff;border-radius:50%;width:30px;margin:0 auto;font-weight:600;box-shadow:0 0 0 4px var(--accent2)}
.dday{text-align:center;margin-top:30px;font-size:14px}
.dday em{font-style:normal;color:var(--accent);font-weight:700;font-family:var(--head);font-size:20px;margin:0 2px}
.dday .badge{display:inline-block;margin-top:12px;font-family:var(--head);font-size:11px;letter-spacing:.24em;color:var(--accent);border:1px solid var(--accent2);background:var(--surface);padding:5px 14px;border-radius:999px}

/* film gallery */
.film{background:var(--film);padding:5px 0;margin:0 -24px;position:relative}
.holes{height:5px;margin:0 10px;background:repeating-linear-gradient(90deg,transparent 0 7px,var(--film-hole) 7px 11px,transparent 11px 17px)}
.strip{display:flex;gap:5px;overflow-x:auto;scroll-snap-type:x mandatory;padding:5px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.fr{flex:none;height:248px;width:166px;max-width:calc(100vw - 30px);scroll-snap-align:center;margin:0;position:relative;background:#2C2520;cursor:zoom-in;border-radius:1px;overflow:hidden}
.fr:focus-visible{outline:2px solid var(--film-hole);outline-offset:-2px}
.fr img{width:100%;height:100%;object-fit:cover;display:block}
.fr figcaption{position:absolute;left:7px;bottom:5px;font:500 8.5px/1 var(--ui);letter-spacing:.16em;color:var(--film-hole)}
.galctl{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:14px;font-family:var(--head);font-size:11px;letter-spacing:.18em;color:var(--muted);font-variant-numeric:tabular-nums}
.galctl button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-family:var(--ui);font-size:14px;line-height:1;padding:0}
.galctl button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.galhint{font-size:11px;color:var(--muted);text-align:center;margin-top:8px}

/* enlarged viewer: swipe left/right while enlarged */
.lb{position:fixed;inset:0;z-index:50;background:rgba(40,32,28,.97)}
.lbtrack{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x pinch-zoom}
.lbtrack::-webkit-scrollbar{display:none}
.lbslide{flex:0 0 100%;width:100%;height:100%;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;scroll-snap-stop:always;cursor:zoom-out}
.lbslide img{max-width:min(100vw,720px);max-height:calc(100vh - 136px);max-height:calc(100svh - 136px);object-fit:contain;display:block;background:#2C2520;box-shadow:0 20px 60px rgba(0,0,0,.5);cursor:default;-webkit-user-drag:none;user-select:none;-webkit-user-select:none}
.lbx,.lbnav{position:absolute;z-index:2;border:1px solid rgba(251,248,241,.28);background:rgba(40,32,28,.55);color:#FBF8F1;border-radius:50%;cursor:pointer;display:grid;place-items:center;font-family:var(--ui);line-height:1;padding:0}
.lbx{top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;width:38px;height:38px;font-size:20px}
.lbnav{top:50%;transform:translateY(-50%);width:36px;height:36px;font-size:18px}
.lbnav.prev{left:10px}.lbnav.next{right:10px}
.lbnav:disabled{opacity:.25;cursor:default}
.lbx:focus-visible,.lbnav:focus-visible{outline:2px solid #FBF8F1;outline-offset:2px}
@media (hover:none) and (max-width:479px){.lbnav{display:none}}
.lbcap{position:absolute;z-index:2;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);text-align:center;color:rgba(251,248,241,.78);font:400 11px/1 var(--ui);letter-spacing:.2em;font-variant-numeric:tabular-nums;pointer-events:none}

/* location */
.venue{text-align:center}
.venue b{font-family:var(--head);font-size:16px;font-weight:600;display:block}
.venue span,.venue a{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;text-decoration:none}
.map{display:block;height:170px;border-radius:var(--radius);border:1px solid var(--line);background-color:var(--surface);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;position:relative;margin:18px 0 14px;overflow:hidden;text-decoration:none}
.map::after{content:"";position:absolute;left:-5%;right:-5%;top:52%;height:7px;background:var(--accent);opacity:.18;border-radius:3px;transform:rotate(-8deg)}
.map .pin{position:absolute;left:50%;top:42%;transform:translate(-50%,-100%);width:20px;height:20px;border-radius:50% 50% 50% 0;background:var(--accent);rotate:-45deg;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.map .pin::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--bg)}
.map .lbl{position:absolute;left:50%;top:48%;transform:translateX(-50%);background:var(--bg);color:var(--ink);font-size:11px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;font-family:var(--head);z-index:1}
.map .st{position:absolute;bottom:10px;font-size:10px;color:var(--muted);background:var(--bg);padding:1px 7px;border-radius:999px;border:1px solid var(--line);font-family:var(--ui);z-index:1}
.map .st.l{left:10px}.map .st.r{right:10px}
.map .tip{position:absolute;right:10px;top:9px;font:400 9.5px/1 var(--ui);color:var(--muted);letter-spacing:.08em;z-index:1}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:0 0 20px}
.btn{display:block;text-align:center;padding:10px 4px;font-size:12px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-family:var(--body);cursor:pointer;width:100%}
.btn.full{grid-column:1/-1}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn:focus-visible,.kk:focus-visible,.seg button:focus-visible,.cp:focus-visible,.acc summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.trans{list-style:none;margin:0;padding:0;font-size:12.5px}
.trans li{display:grid;grid-template-columns:48px 1fr;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.trans li:last-child{border-bottom:1px solid var(--line)}
.trans b{font-family:var(--head);font-weight:600;color:var(--accent);font-size:11px;letter-spacing:.14em;padding-top:3px}
.trans small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}

/* rsvp / account / share */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}
.seg button{padding:10px;text-align:center;font-size:12.5px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);cursor:pointer;font-family:var(--body)}
.seg button.on{border-color:var(--accent);color:var(--accent);font-weight:700;background:var(--accent2)}
.rsvp{margin-top:18px}
.rfld{display:block;margin-bottom:10px}
.rfld span{display:block;font-family:var(--head);font-size:11px;letter-spacing:.14em;color:var(--accent);margin:0 2px 6px}
.rfld input{width:100%;padding:11px 14px;font-size:16px;font-family:var(--body);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);-webkit-appearance:none;appearance:none}
.rfld input::placeholder{color:var(--muted);opacity:.75;font-size:14px}
.rfld input:focus-visible,.stp button:focus-visible,.rlink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rcnt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 6px 8px 14px;margin:10px 0 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);font-size:12.5px}
.rcnt small{color:var(--muted);font-size:11px;margin-left:4px}
.stp{display:flex;align-items:center;gap:4px}
.stp button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1;cursor:pointer;padding:0}
.stp button:disabled{opacity:.35;cursor:default}
.stp output{min-width:30px;text-align:center;font-family:var(--head);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.rnote{font-size:12px;color:#A6453B;text-align:center;margin:0 0 10px}
.rlink{display:block;width:100%;margin-top:12px;padding:4px;border:0;background:none;text-align:center;font-family:var(--body);font-size:11.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.rdone{margin-top:18px;padding:22px 16px 14px;text-align:center;border:1px solid var(--accent2);border-radius:var(--radius);background:var(--surface)}
.rdone b{display:block;font-family:var(--head);font-size:14.5px;font-weight:600;color:var(--accent);margin-bottom:6px}
.rdone span{display:block;font-size:12.5px;color:var(--ink)}
.acc{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-bottom:8px;overflow:hidden}
.acc summary{list-style:none;cursor:pointer;padding:13px 16px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font-weight:400;color:var(--muted);font-size:16px}
.acc[open] summary::after{content:"−"}
.acc .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 16px;border-top:1px solid var(--line);font-size:12px}
.acc .row span{color:var(--muted)}
.acc .row b{font-weight:500;display:block;font-variant-numeric:tabular-nums}
.acc .cp{font-size:10.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font-family:var(--ui);flex:none}
.share{display:grid;gap:8px}
.kk{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:var(--radius);background:#FEE500;color:#191919;font-size:13px;font-weight:700;border:0;font-family:var(--body);cursor:pointer;width:100%}
.kk i{width:17px;height:15px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#191919;display:inline-block;position:relative}
.kk i::after{content:"";position:absolute;left:3px;bottom:-3px;border:4px solid transparent;border-top-color:#191919;border-left-color:#191919}
.ft{text-align:center;padding:40px 24px calc(env(safe-area-inset-bottom,0px) + 48px);font-size:11.5px;color:var(--muted);border-top:1px solid var(--line)}
.ft b{display:block;font-family:var(--head);font-size:15px;color:var(--ink);margin-bottom:6px;font-weight:600}
.ft .scr{font-family:var(--script);font-size:26px;color:var(--accent);margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--ink);color:#FBF8F1;font:400 12px/1.4 var(--ui);padding:10px 16px;border-radius:999px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px);text-align:center}
</style>
</head>
<body>
<main class="inv" id="inv">
  <section class="cover">
    <img id="coverImg" alt="">
    <div class="topo"><div class="scr" id="coverLettering"></div><div class="eb" id="coverLabel"></div></div>
    <div class="ov">
      <h1 class="nm" id="coverNames"></h1>
      <div class="dt" id="coverDate"></div>
      <div class="vn" id="coverVenue"></div>
    </div>
    <div class="down" aria-hidden="true">⌄</div>
  </section>

  <section class="sec">
    <div class="eb">Invitation</div>
    <h2 class="ttl" id="greetTitle"></h2>
    <div class="quote" id="greetQuote"></div>
    <p class="p" id="greetMsg"></p>
  </section>

  <section class="sec">
    <div class="eb">About Us</div>
    <div class="couple" id="couple"></div>
  </section>

  <section class="sec">
    <div class="eb">Wedding Day</div>
    <h2 class="ttl" id="dayTitle"></h2>
    <div class="cal" id="cal"></div>
    <p class="dday" id="dday"></p>
  </section>

  <section class="sec">
    <div class="eb">Gallery</div>
    <h2 class="ttl" id="galTitle"></h2>
    <div class="film">
      <div class="holes"></div>
      <div class="strip" id="strip"></div>
      <div class="holes"></div>
    </div>
    <div class="galctl"><button type="button" id="gprev" aria-label="이전 사진">‹</button><span id="gpos"></span><button type="button" id="gnext" aria-label="다음 사진">›</button></div>
    <p class="galhint">사진을 누르면 크게 보이고, 그대로 옆으로 넘길 수 있어요</p>
  </section>

  <section class="sec">
    <div class="eb">Location</div>
    <div class="venue" id="venue"></div>
    <a class="map" id="map" target="_blank" rel="noopener"><span class="tip">눌러서 지도 열기</span><span class="pin"></span><span class="lbl" id="mapLbl"></span></a>
    <div class="btns" id="mapBtns"></div>
    <ul class="trans" id="trans"></ul>
  </section>

  <section class="sec" id="secRsvp">
    <div class="eb">RSVP</div>
    <h2 class="ttl" id="rsvpTitle"></h2>
    <p class="p" id="rsvpMsg"></p>
    <form class="rsvp" id="rsvpForm" novalidate>
      <label class="rfld"><span>성함</span><input type="text" id="rsvpName" name="name" autocomplete="name" maxlength="30" placeholder="성함을 적어 주세요"></label>
      <div class="seg" data-seg="side" role="group" aria-label="어느 쪽 하객이신가요"><button type="button" class="on" data-v="신랑측">신랑측</button><button type="button" data-v="신부측">신부측</button></div>
      <div class="seg" data-seg="attend" role="group" aria-label="참석 여부"><button type="button" class="on" data-v="참석">참석</button><button type="button" data-v="미참석">미참석</button></div>
      <div class="rcnt" id="rsvpCountRow"><span>참석 인원 <small>본인 포함</small></span><div class="stp"><button type="button" id="rsvpMinus" aria-label="인원 줄이기">−</button><output id="rsvpCount" aria-live="polite">1</output><button type="button" id="rsvpPlus" aria-label="인원 늘리기">+</button></div></div>
      <p class="rnote" id="rsvpNote" role="alert" hidden></p>
      <button type="submit" class="btn pri full" id="rsvpBtn">참석 의사 전달하기</button>
      <a class="rlink" id="rsvpFallback" target="_blank" rel="noopener" hidden>전송이 어려우면 구글 폼으로 보내기</a>
    </form>
    <div class="rdone" id="rsvpDone" hidden>
      <b>전달되었습니다. 감사합니다.</b>
      <span id="rsvpSummary"></span>
      <button type="button" class="rlink" id="rsvpAgain">내용을 고쳐서 다시 보내기</button>
    </div>
  </section>

  <section class="sec" id="secAccount">
    <div class="eb">Account</div>
    <h2 class="ttl" id="accTitle"></h2>
    <div id="accList"></div>
  </section>

  <section class="sec">
    <div class="eb">Share</div>
    <div class="share"><button class="kk" type="button" id="shareBtn"><i></i>카카오톡으로 공유하기</button><button type="button" class="btn" id="copyBtn">청첩장 주소 복사하기</button></div>
  </section>

  <footer class="ft"><div class="scr" id="endLettering"></div><b id="endNames"></b><span id="endMsg"></span></footer>
</main>

<button class="bgm" id="bgm" type="button" aria-label="배경음악 켜기" aria-pressed="false" hidden><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span></button>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="사진 크게 보기">
  <div class="lbtrack" id="lbtrack"></div>
  <button type="button" class="lbx" id="lbx" aria-label="닫기">×</button>
  <button type="button" class="lbnav prev" id="lbprev" aria-label="이전 사진">‹</button>
  <button type="button" class="lbnav next" id="lbnext" aria-label="다음 사진">›</button>
  <div class="lbcap" id="lbcap"></div>
</div>

<script src="content.js"></script>
<script>
function startInvitation(preview){
  var D = window.INVITATION;
  function $(id){ return document.getElementById(id); }
  if(!D){
    $('inv').innerHTML = '<div class="err"><b>content.js 를 읽지 못했습니다.</b><br>따옴표(" ")나 줄 끝 쉼표(,)가 지워지지 않았는지 확인해 주세요.</div>';
    return;
  }
  function el(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function toast(msg){ var t = el('div', 'toast', msg); document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 1800); }
  function copyText(text, done){
    function ok(){ toast(done); }
    function legacy(){
      var ta = el('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;left:-999px;top:0;opacity:0';
      document.body.appendChild(ta); ta.select();
      var good = false; try{ good = document.execCommand('copy'); }catch(e){}
      ta.remove(); toast(good ? done : '복사하지 못했습니다. 길게 눌러 복사해 주세요');
    }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(ok, legacy); } else { legacy(); }
  }
  var G = D.groom || {}, B = D.bride || {}, V = D.venue || {}, W = D.wedding || {};
  var pageUrl = D.siteUrl || location.href.split('#')[0];

  /* ---------- date ---------- */
  var dp = String(W.date || '').split('-').map(Number), tp = String(W.time || '0:0').split(':').map(Number);
  var Y = dp[0], M = dp[1], DD = dp[2], hh = tp[0] || 0, mm = tp[1] || 0;
  var wd = new Date(Y, M - 1, DD).getDay();
  var KW = ['일','월','화','수','목','금','토'], EW = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  var h12 = hh % 12 === 0 ? 12 : hh % 12;
  var koTime = (hh === 12 && mm === 0) ? '낮 12시' : (hh < 12 ? '오전 ' : '오후 ') + h12 + '시' + (mm ? ' ' + mm + '분' : '');
  var koDate = Y + '년 ' + M + '월 ' + DD + '일 ' + KW[wd] + '요일 ' + koTime;
  var enDate = Y + '. ' + pad(M) + '. ' + pad(DD) + '. ' + EW[wd] + ' ' + (hh < 12 ? 'AM' : 'PM') + ' ' + h12 + ':' + pad(mm);

  /* ---------- cover ---------- */
  var C = D.cover || {};
  var cimg = $('coverImg'); cimg.src = C.photo || ''; cimg.alt = (G.name || '') + ' ' + (B.name || '') + ' 웨딩 사진';
  if(C.focus) cimg.style.objectPosition = C.focus;
  $('coverLettering').textContent = C.lettering || '';
  $('coverLabel').textContent = C.label || '';
  /* the lettering block can be moved from the admin page: textY = % of the screen from the top, textX = % sideways (0 = centre) */
  var topo = $('coverLettering').parentNode, tY = parseFloat(C.textY), tX = parseFloat(C.textX);
  if(isFinite(tY)) topo.style.top = Math.max(0, Math.min(85, tY)) + '%';
  if(isFinite(tX) && tX) topo.style.transform = 'translateX(' + Math.max(-40, Math.min(40, tX)) + '%)';
  var nm = $('coverNames'); nm.appendChild(document.createTextNode(G.name || '')); nm.appendChild(el('i', '', '♡')); nm.appendChild(document.createTextNode(B.name || ''));
  $('coverDate').textContent = enDate;
  $('coverVenue').textContent = [V.name, V.city].filter(Boolean).join(', ');
  if(D.share && D.share.title) document.title = D.share.title;

  /* ---------- greeting ---------- */
  var Gr = D.greeting || {};
  $('greetTitle').textContent = Gr.title || '';
  var q = $('greetQuote');
  if(Gr.quote){ q.textContent = Gr.quote; if(Gr.quoteSource) q.appendChild(el('small', '', Gr.quoteSource)); } else { q.hidden = true; }
  $('greetMsg').textContent = Gr.message || '';

  /* ---------- couple ---------- */
  function person(p, role){
    var d = el('div');
    if(p.photo){ var im = el('img', 'yp'); im.src = p.photo; im.alt = role + ' ' + (p.name || ''); im.loading = 'lazy'; d.appendChild(im); }
    d.appendChild(el('div', 'who', role));
    d.appendChild(el('div', 'nm', p.name || ''));
    var parents = [p.father, p.mother].filter(Boolean).join(' · ');
    var line = parents ? parents + (p.relation ? '의 ' + p.relation : '') : (p.relation || '');
    if(line) d.appendChild(el('div', 'par', line));
    if(p.intro) d.appendChild(el('div', 'tag', p.intro));
    return d;
  }
  var cp = $('couple'); cp.appendChild(person(G, '신랑')); cp.appendChild(el('div', 'amp', '&')); cp.appendChild(person(B, '신부'));

  /* ---------- calendar + d-day (days only) ---------- */
  $('dayTitle').textContent = koDate;
  var cal = $('cal'); KW.forEach(function(k){ cal.appendChild(el('b', '', k)); });
  var first = new Date(Y, M - 1, 1).getDay(), last = new Date(Y, M, 0).getDate(), i;
  for(i = 0; i < first; i++) cal.appendChild(el('i'));
  for(i = 1; i <= last; i++){ var w = (first + i - 1) % 7; cal.appendChild(el('i', i === DD ? 'on' : (w === 0 ? 'sun' : (w === 6 ? 'sat' : '')), String(i))); }
  var now = new Date(), left = Math.round((Date.UTC(Y, M - 1, DD) - Date.UTC(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
  var dd = $('dday'), pair = (G.givenName || G.name || '') + ' ♡ ' + (B.givenName || B.name || '');
  if(left > 0){ dd.appendChild(document.createTextNode(pair + '의 결혼식까지 ')); dd.appendChild(el('em', '', String(left))); dd.appendChild(document.createTextNode('일 남았습니다')); dd.appendChild(el('br')); dd.appendChild(el('span', 'badge', 'D - ' + left)); }
  else if(left === 0){ dd.appendChild(document.createTextNode('오늘, ' + pair + '가 결혼합니다')); dd.appendChild(el('br')); dd.appendChild(el('span', 'badge', 'D - DAY')); }
  else { dd.appendChild(document.createTextNode('함께해 주셔서 감사합니다')); dd.appendChild(el('br')); dd.appendChild(el('span', 'badge', Y + '. ' + pad(M) + '. ' + pad(DD))); }

  /* ---------- gallery: film strip ---------- */
  var Ga = D.gallery || {}, photos = (Ga.photos || []).filter(Boolean), total = photos.length;
  $('galTitle').textContent = Ga.title || '';
  var strip = $('strip'), frames = [], gpos = $('gpos');
  photos.forEach(function(src, n){
    var f = el('figure', 'fr'); f.tabIndex = 0; f.setAttribute('role', 'button'); f.setAttribute('aria-label', '사진 ' + (n + 1) + ' 크게 보기');
    var im = el('img'); im.loading = 'lazy'; im.decoding = 'async'; im.alt = '웨딩 사진 ' + (n + 1);
    im.addEventListener('load', function(){ if(im.naturalHeight) f.style.width = Math.round(248 * im.naturalWidth / im.naturalHeight) + 'px'; });
    im.src = src; f.appendChild(im); f.appendChild(el('figcaption', '', pad(n + 1)));
    f.addEventListener('click', function(){ openLb(n); });
    f.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openLb(n); } });
    strip.appendChild(f); frames.push(f);
  });
  function stripIndex(){ if(strip.scrollLeft <= 2) return 0; if(strip.scrollLeft >= strip.scrollWidth - strip.clientWidth - 2) return Math.max(0, total - 1); var c = strip.scrollLeft + strip.clientWidth / 2, best = 0, bd = 1e9; frames.forEach(function(f, n){ var d = Math.abs(f.offsetLeft + f.offsetWidth / 2 - c); if(d < bd){ bd = d; best = n; } }); return best; }
  function stripGo(n, smooth){ n = Math.max(0, Math.min(total - 1, n)); var f = frames[n]; if(f) strip.scrollTo({ left: f.offsetLeft + f.offsetWidth / 2 - strip.clientWidth / 2, behavior: smooth ? 'smooth' : 'auto' }); }
  function stripCap(){ gpos.textContent = total ? pad(stripIndex() + 1) + ' / ' + pad(total) : ''; }
  strip.addEventListener('scroll', stripCap, { passive: true }); stripCap();
  $('gprev').addEventListener('click', function(){ stripGo(stripIndex() - 1, true); });
  $('gnext').addEventListener('click', function(){ stripGo(stripIndex() + 1, true); });

  /* ---------- gallery: enlarged viewer (swipe while enlarged) ---------- */
  var lb = $('lb'), track = $('lbtrack'), lbcap = $('lbcap'), lbprev = $('lbprev'), lbnext = $('lbnext'), slides = [], cur = 0, aim = 0, aimLock = 0, pushed = false, opener = null;
  photos.forEach(function(src, n){
    var s = el('div', 'lbslide'), im = el('img'); im.alt = '웨딩 사진 ' + (n + 1); im.setAttribute('data-src', src); im.draggable = false;
    s.appendChild(im); track.appendChild(s); slides.push(s);
    s.addEventListener('click', function(e){ if(e.target === s) closeLb(); });
  });
  function ensure(n){ [n - 1, n, n + 1].forEach(function(k){ var s = slides[k]; if(!s) return; var im = s.firstChild; if(!im.getAttribute('src')) im.src = im.getAttribute('data-src'); }); }
  function lbCap(){ lbcap.textContent = pad(cur + 1) + ' / ' + pad(total); lbprev.disabled = cur <= 0; lbnext.disabled = cur >= total - 1; }
  function lbStep(d){ aim = Math.max(0, Math.min(total - 1, aim + d)); aimLock = Date.now() + 700; ensure(aim); track.scrollTo({ left: aim * track.clientWidth, behavior: 'smooth' }); }
  function openLb(n){
    cur = aim = n; aimLock = 0; opener = frames[n] || null; ensure(n);
    lb.hidden = false; document.body.style.overflow = 'hidden';
    track.scrollLeft = n * track.clientWidth; lbCap();
    try{ history.pushState({ viewer: 1 }, ''); pushed = true; }catch(e){ pushed = false; }
    try{ $('lbx').focus({ preventScroll: true }); }catch(e){}
  }
  function closeLb(fromBack){
    if(lb.hidden) return;
    lb.hidden = true; document.body.style.overflow = '';
    stripGo(cur, false); stripCap();
    if(opener){ try{ frames[cur].focus({ preventScroll: true }); }catch(e){} }
    if(pushed){ pushed = false; if(!fromBack){ try{ history.back(); }catch(e){} } }
  }
  track.addEventListener('scroll', function(){
    if(lb.hidden || !track.clientWidth) return;
    var n = Math.max(0, Math.min(total - 1, Math.round(track.scrollLeft / track.clientWidth)));
    if(n !== cur){ cur = n; ensure(n); lbCap(); }
    if(Date.now() > aimLock) aim = cur;
  }, { passive: true });
  $('lbx').addEventListener('click', function(){ closeLb(); });
  lbprev.addEventListener('click', function(){ lbStep(-1); });
  lbnext.addEventListener('click', function(){ lbStep(1); });
  window.addEventListener('popstate', function(){ if(!lb.hidden) closeLb(true); });
  window.addEventListener('resize', function(){ if(!lb.hidden) track.scrollLeft = cur * track.clientWidth; });
  document.addEventListener('keydown', function(e){
    if(lb.hidden) return;
    if(e.key === 'Escape') closeLb();
    else if(e.key === 'ArrowRight') lbStep(1);
    else if(e.key === 'ArrowLeft') lbStep(-1);
  });

  /* ---------- location ---------- */
  var ve = $('venue'); ve.appendChild(el('b', '', V.name || ''));
  if(V.hall) ve.appendChild(el('span', '', V.hall));
  if(V.address) ve.appendChild(el('span', '', V.address));
  if(V.tel){ var tel = el('a', '', V.tel); tel.href = 'tel:' + String(V.tel).replace(/[^0-9+]/g, ''); ve.appendChild(tel); }
  var query = encodeURIComponent(V.mapSearch || V.name || ''), kakaoMap = 'https://map.kakao.com/link/search/' + query;
  var map = $('map'); map.href = kakaoMap; map.setAttribute('aria-label', (V.name || '') + ' 지도 열기'); $('mapLbl').textContent = V.name || '';
  (V.stations || []).slice(0, 2).forEach(function(s, n){ if(s) map.appendChild(el('span', 'st ' + (n ? 'r' : 'l'), s)); });
  var mb = $('mapBtns');
  [['카카오맵', kakaoMap], ['네이버지도', 'https://map.naver.com/p/search/' + query], ['티맵', 'tmap://search?name=' + encodeURIComponent(V.name || '')]].forEach(function(m){
    var a = el('a', 'btn', m[0]); a.href = m[1];
    if(m[1].indexOf('http') === 0){ a.target = '_blank'; a.rel = 'noopener'; }
    else { a.addEventListener('click', function(){ setTimeout(function(){ if(!document.hidden) toast('티맵 앱이 설치된 휴대폰에서 열립니다'); }, 1200); }); }
    mb.appendChild(a);
  });
  var tr = $('trans');
  (D.transport || []).forEach(function(t){ var li = el('li'); li.appendChild(el('b', '', t.label || '')); var sp = el('span', '', t.text || ''); if(t.note) sp.appendChild(el('small', '', t.note)); li.appendChild(sp); tr.appendChild(li); });
  if(!tr.children.length) tr.hidden = true;

  /* ---------- rsvp: sends to a Google Form only when the guest taps the button ---------- */
  var R = D.rsvp || {}, RF = R.form || {};
  if(R.show === false){ $('secRsvp').remove(); }
  else {
    $('rsvpTitle').textContent = R.title || ''; $('rsvpMsg').textContent = R.message || '';
    var rForm = $('rsvpForm'), rDone = $('rsvpDone'), rName = $('rsvpName'), rNote = $('rsvpNote'), rBtn = $('rsvpBtn'), rFall = $('rsvpFallback');
    var rCount = 1, rBusy = false, RKEY = 'wedding-rsvp', rReady = !!(RF.id && RF.name && RF.side && RF.attend && RF.count);
    var segVal = function(name){ var on = rForm.querySelector('[data-seg="' + name + '"] .on'); return on ? on.getAttribute('data-v') : ''; };
    var segSet = function(name, v){ rForm.querySelectorAll('[data-seg="' + name + '"] button').forEach(function(b){ var on = b.getAttribute('data-v') === v; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); }); };
    var drawCount = function(){ $('rsvpCount').textContent = rCount; $('rsvpMinus').disabled = rCount <= 1; $('rsvpPlus').disabled = rCount >= 10; $('rsvpCountRow').hidden = segVal('attend') !== '참석'; };
    var rValues = function(){ var at = segVal('attend'); return { name: rName.value.replace(/\s+/g, ' ').trim(), side: segVal('side'), attend: at, count: at === '참석' ? rCount : 0 }; };
    var rParams = function(v){ var q = new URLSearchParams(); q.append(RF.name, v.name); q.append(RF.side, v.side); q.append(RF.attend, v.attend); q.append(RF.count, String(v.count)); return q; };
    var rUrl = function(kind){ return 'https://docs.google.com/forms/d/e/' + RF.id + '/' + kind; };
    var rShowDone = function(v){ $('rsvpSummary').textContent = [v.name, v.side, v.attend === '참석' ? '참석 ' + v.count + '명' : '미참석'].join(' · '); rForm.hidden = true; rDone.hidden = false; };
    var rSay = function(msg){ rNote.textContent = msg; rNote.hidden = !msg; };
    rForm.querySelectorAll('[data-seg]').forEach(function(g){ g.querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-pressed', b.classList.contains('on') ? 'true' : 'false'); b.addEventListener('click', function(){ segSet(g.getAttribute('data-seg'), b.getAttribute('data-v')); drawCount(); }); }); });
    $('rsvpMinus').addEventListener('click', function(){ if(rCount > 1){ rCount--; drawCount(); } });
    $('rsvpPlus').addEventListener('click', function(){ if(rCount < 10){ rCount++; drawCount(); } });
    rName.addEventListener('input', function(){ rSay(''); });
    if(rReady){ rFall.hidden = false; rFall.addEventListener('click', function(){ rFall.href = rUrl('viewform') + '?usp=pp_url&' + rParams(rValues()).toString(); }); rFall.href = rUrl('viewform'); }
    rForm.addEventListener('submit', function(e){
      e.preventDefault(); if(rBusy) return;
      var v = rValues();
      if(!v.name){ rSay('성함을 적어 주세요'); rName.focus(); return; }
      if(preview){ toast('미리보기에서는 전송되지 않습니다'); return; }
      if(!rReady){ toast('참석 조사는 아직 연결 전입니다'); return; }
      rBusy = true; rBtn.disabled = true; rBtn.textContent = '보내는 중…'; rSay('');
      var finish = function(){ rBusy = false; rBtn.disabled = false; rBtn.textContent = '참석 의사 전달하기'; };
      fetch(rUrl('formResponse'), { method: 'POST', mode: 'no-cors', body: rParams(v) }).then(function(){
        finish(); try{ localStorage.setItem(RKEY, JSON.stringify(v)); }catch(e){} rShowDone(v);
      }, function(){
        finish(); rSay('전송하지 못했습니다. 잠시 뒤 다시 누르거나 아래 구글 폼으로 보내 주세요.');
      });
    });
    $('rsvpAgain').addEventListener('click', function(){ rDone.hidden = true; rForm.hidden = false; rName.focus(); });
    drawCount();
    if(!preview){ try{ var sent = JSON.parse(localStorage.getItem(RKEY) || 'null'); if(sent && sent.name){ rName.value = sent.name; segSet('side', sent.side); segSet('attend', sent.attend); if(sent.count >= 1) rCount = Math.min(10, sent.count); drawCount(); rShowDone(sent); } }catch(e){} }
  }

  /* ---------- accounts ---------- */
  var A = D.accounts || {}, al = $('accList');
  $('accTitle').textContent = A.title || '';
  [['신랑측 계좌번호', A.groomSide], ['신부측 계좌번호', A.brideSide]].forEach(function(side){
    var list = (side[1] || []).filter(function(a){ return a && a.number; }); if(!list.length) return;
    var d = el('details', 'acc'); d.appendChild(el('summary', '', side[0]));
    list.forEach(function(a){
      var row = el('div', 'row'), info = el('div'); info.appendChild(el('span', '', a.who || '')); var num = [a.bank, a.number].filter(Boolean).join(' '); info.appendChild(el('b', '', num));
      var b = el('button', 'cp', '복사'); b.type = 'button'; b.setAttribute('aria-label', (a.who || '') + ' 계좌번호 복사'); b.addEventListener('click', function(){ copyText(num, '계좌번호를 복사했습니다'); });
      row.appendChild(info); row.appendChild(b); d.appendChild(row);
    });
    al.appendChild(d);
  });
  if(!al.children.length) $('secAccount').remove();

  /* ---------- share ---------- */
  var S = D.share || {};
  $('shareBtn').addEventListener('click', function(){
    if(navigator.share){ navigator.share({ title: S.title || document.title, text: S.description || '', url: pageUrl }).catch(function(){}); }
    else { copyText(pageUrl, '주소를 복사했습니다. 카카오톡 대화창에 붙여 넣어 주세요'); }
  });
  $('copyBtn').addEventListener('click', function(){ copyText(pageUrl, '청첩장 주소를 복사했습니다'); });

  /* ---------- entry: a viewfinder first; the shutter lets the sunlight in and opens the invitation ---------- */
  var En = D.entry || {}, gated = En.show !== false, bgmUnlock = null, bgmStart = null, root = document.documentElement;
  var bgmDelay = Math.max(0, Math.min(30, parseFloat(D.bgmDelay) || 0)) * 1000;
  if(gated){
    var cov = cimg.parentNode, gate = el('div', 'gate'), sunL = el('div', 'sunl'), going = false, actx = null;
    gate.innerHTML = '<div class="hud tl">AF-S</div><div class="hud tr">RAW<span class="bat"></span></div><i class="br b1"></i><i class="br b2"></i><i class="br b3"></i><i class="br b4"></i><div class="fbox"></div><div class="txt"><div class="gnm"></div><div class="gdt"></div></div><div class="expo"><span>1/125</span><span>F2.8</span><span>ISO 200</span><span class="xd"></span></div><div class="act"><button type="button" class="go" aria-label="셔터를 눌러 청첩장 열기"></button><div class="hint">셔터를 눌러 주세요</div></div><i class="blade t"></i><i class="blade b"></i>';
    var gnm = gate.querySelector('.gnm'); gnm.appendChild(document.createTextNode(G.givenName || G.name || '')); gnm.appendChild(el('i', '', '♡')); gnm.appendChild(document.createTextNode(B.givenName || B.name || ''));
    gate.querySelector('.gdt').textContent = En.message || '결혼식에 초대합니다';
    gate.querySelector('.xd').textContent = Y + '.' + pad(M) + '.' + pad(DD);
    sunL.innerHTML = '<i class="haze"></i><i class="shaft two"></i><i class="shaft"></i><i class="src"></i>';
    var seed = 7, rnd = function(){ seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    for(var mi = 0; mi < 16; mi++){
      var mo = el('i', 'm');
      mo.style.cssText = '--x:' + (30 + rnd() * 66).toFixed(1) + '%;--y:' + (8 + rnd() * 62).toFixed(1) + '%;--d:' + (2 + rnd() * 5).toFixed(1) + 'px;--b:' + (0.4 + rnd() * 1.8).toFixed(1) + 'px;--o:' + (0.35 + rnd() * 0.5).toFixed(2) + ';--mx:' + (-8 - rnd() * 22).toFixed(0) + 'px;--my:' + (-10 - rnd() * 26).toFixed(0) + 'px;--t:' + (2 + rnd() * 1.4).toFixed(2) + 's;--w:' + (rnd() * 0.9).toFixed(2) + 's';
      sunL.appendChild(mo);
    }
    cov.appendChild(gate); cov.appendChild(sunL); cov.classList.add('gated'); root.classList.add('gated');
    try{ if('scrollRestoration' in history) history.scrollRestoration = 'manual'; }catch(e){}
    window.scrollTo(0, 0);
    gate.addEventListener('touchmove', function(e){ e.preventDefault(); }, { passive: false });
    var snd = function(){ try{ if(!actx){ var AC = window.AudioContext || window.webkitAudioContext; if(AC) actx = new AC(); } if(actx && actx.state === 'suspended') actx.resume(); }catch(e){ actx = null; } return actx; };
    var sndClick = function(at, gain, hp){
      var n = Math.floor(actx.sampleRate * 0.045), buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0), k;
      for(k = 0; k < n; k++) d[k] = (Math.random() * 2 - 1) * Math.pow(1 - k / n, 3.2);
      var s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
      s.buffer = buf; f.type = 'highpass'; f.frequency.value = hp; g.gain.value = gain; s.connect(f); f.connect(g); g.connect(actx.destination); s.start(at);
    };
    var sndThump = function(at){
      var o = actx.createOscillator(), g = actx.createGain();
      o.frequency.setValueAtTime(170, at); o.frequency.exponentialRampToValueAtTime(60, at + 0.06);
      g.gain.setValueAtTime(0.5, at); g.gain.exponentialRampToValueAtTime(0.001, at + 0.07);
      o.connect(g); g.connect(actx.destination); o.start(at); o.stop(at + 0.08);
    };
    var sndShutter = function(){ if(!snd()) return; try{ var t = actx.currentTime + 0.01; sndClick(t, 0.9, 1400); sndThump(t); sndClick(t + 0.085, 0.6, 2400); sndThump(t + 0.085); }catch(e){} };
    var sndFocus = function(){
      if(!snd()) return;
      try{ [0, 0.12].forEach(function(dt){ var t = actx.currentTime + 0.05 + dt, o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; o.frequency.value = 2350; g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.12, t + 0.005); g.gain.setValueAtTime(0.12, t + 0.05); g.gain.linearRampToValueAtTime(0.0001, t + 0.06); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + 0.07); }); }catch(e){}
    };
    var gateOpen = function(){ cov.classList.add('sunup'); if(bgmStart) setTimeout(bgmStart, bgmDelay); };
    var gateUnlock = function(){ root.classList.remove('gated'); };
    var gateDone = function(){ gate.remove(); sunL.remove(); cov.classList.remove('gated', 'focus', 'snap', 'sunup'); if(actx && actx.close){ try{ actx.close(); }catch(e){} } };
    gate.querySelector('.go').addEventListener('click', function(){
      if(going) return; going = true;
      if(bgmUnlock) bgmUnlock();   /* this tap gives the music permission to start once the invitation is open */
      if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches){ sndShutter(); gateOpen(); setTimeout(gateUnlock, 500); setTimeout(gateDone, 1000); return; }
      cov.classList.add('focus'); sndFocus();
      setTimeout(function(){ cov.classList.add('snap'); sndShutter(); }, 700);
      setTimeout(gateOpen, 900);
      setTimeout(gateUnlock, 2100);
      setTimeout(gateDone, 4700);
    });
  }

  /* ---------- bgm: starts when the invitation opens (after the shutter), top-right button turns it off and on ---------- */
  if(D.bgm){
    var bb = $('bgm'), audio = new Audio(), userOff = false, resume = false, priming = false, wanted = false, armed = false;
    audio.loop = true; audio.preload = 'auto'; audio.src = D.bgm; bb.hidden = false;
    var bgmDraw = function(){ var on = !audio.paused && !priming; bb.classList.toggle('on', on); bb.setAttribute('aria-pressed', on ? 'true' : 'false'); bb.setAttribute('aria-label', on ? '배경음악 끄기' : '배경음악 켜기'); };
    audio.addEventListener('play', bgmDraw); audio.addEventListener('pause', bgmDraw);
    /* if the browser refuses to start it by itself, the guest's next touch anywhere starts it */
    var kickOn = ['click', 'touchend', 'keydown'];
    var disarm = function(){ if(!armed) return; armed = false; kickOn.forEach(function(t){ document.removeEventListener(t, kick, true); }); };
    var arm = function(){ if(armed || userOff) return; armed = true; kickOn.forEach(function(t){ document.addEventListener(t, kick, true); }); };
    var tryPlay = function(){ var p; try{ p = audio.play(); }catch(e){} if(p && p.then) p.then(disarm, arm); };
    var kick = function(e){
      if(userOff || !audio.paused){ disarm(); return; }
      if(bb.contains(e.target) || root.classList.contains('gated')) return;
      tryPlay();
    };
    bb.addEventListener('click', function(){
      if(audio.paused){ userOff = false; var p; try{ p = audio.play(); }catch(e){} if(p && p.catch) p.catch(function(){ toast('음악을 재생하지 못했습니다'); }); }
      else { userOff = true; disarm(); audio.pause(); }
    });
    /* called inside the shutter tap: a silent play-and-pause, so the phone lets the music start a moment later */
    bgmUnlock = function(){
      priming = true; audio.muted = true;
      var settle = function(){
        priming = false;
        if(wanted){ audio.muted = false; bgmDraw(); setTimeout(function(){ if(audio.paused && !userOff) tryPlay(); }, 150); }
        else { audio.pause(); try{ audio.currentTime = 0; }catch(e){} audio.muted = false; }
      };
      var p; try{ p = audio.play(); }catch(e){}
      if(p && p.then) p.then(settle, function(){ priming = false; audio.muted = false; if(wanted) tryPlay(); }); else settle();
    };
    bgmStart = function(){ wanted = true; if(priming || userOff || !audio.paused) return; try{ audio.currentTime = 0; }catch(e){} tryPlay(); };
    if(!preview){
      if(!gated) bgmStart();
      document.addEventListener('visibilitychange', function(){
        if(document.hidden){ resume = !audio.paused; if(resume) audio.pause(); }
        else if(resume && !userOff){ resume = false; tryPlay(); }
      });
    }
  }

  /* ---------- closing ---------- */
  var E = D.closing || {};
  $('endLettering').textContent = E.lettering || '';
  $('endNames').textContent = (G.name || '') + ' ♡ ' + (B.name || '');
  $('endMsg').textContent = E.message || '';
}
/* Normal visit: draw right away. Inside the admin preview frame: wait for the unsaved content, then draw. */
(function(){
  var inPreview = /[?&]preview=1(&|$)/.test(location.search) && window.parent !== window;
  if(!inPreview){ startInvitation(false); return; }
  window.addEventListener('message', function onMsg(e){
    if(e.origin !== location.origin || !e.data || e.data.type !== 'invitation-preview') return;
    window.removeEventListener('message', onMsg);
    window.INVITATION = e.data.content; startInvitation(true);
  });
  window.parent.postMessage({ type: 'invitation-preview-ready' }, location.origin);
})();
</script>
