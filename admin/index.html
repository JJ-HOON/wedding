<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' https://api.github.com; frame-src 'self'; base-uri 'none'; form-action 'none'">
<title>청첩장 관리</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Pinyon+Script&display=swap">
<style>
:root{
  --bg:#F2F0EA; --card:#FFFFFF; --ink:#2F2823; --muted:#7A7068; --line:#E0D9CD; --soft:#F7F5F0;
  --accent:#66704B; --accent-soft:#ECEFE1; --danger:#A6453B; --danger-soft:#F7E9E6; --warn:#8A6A1E; --warn-soft:#F6EFD9;
  --ui:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:12px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;padding:0 0 calc(86px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.top{padding:calc(18px + env(safe-area-inset-top,0px)) 0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
.top .links{display:flex;gap:14px;font-size:13px;margin-top:2px}
.chip{font-size:12px;font-weight:500;padding:5px 11px;border-radius:999px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.bad{background:var(--danger-soft);color:var(--danger)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.card>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.card>summary::-webkit-details-marker{display:none}
.card>summary b{font-size:15px;font-weight:700}
.card>summary span{font-size:12px;color:var(--muted);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.card>summary::after{content:"열기";font-size:12px;color:var(--accent);flex:none}
.card[open]>summary::after{content:"접기"}
.card[open]>summary{border-bottom:1px solid var(--line)}
.card>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.body{padding:16px;display:grid;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.sub{font-size:13px;font-weight:700;margin-top:4px;padding-top:14px;border-top:1px dashed var(--line)}
.sub:first-child{margin-top:0;padding-top:0;border-top:0}
.note{font-size:12.5px;color:var(--muted);line-height:1.65}
.note b{color:var(--ink);font-weight:500}
.note.warn{background:var(--warn-soft);color:#6B5216;padding:10px 12px;border-radius:8px}
ol.steps{margin:0;padding-left:20px;font-size:13px;display:grid;gap:5px}
ol.steps b{font-weight:700}

.fld{display:grid;gap:5px;min-width:0}
.fld .lb{font-size:12px;font-weight:500;color:var(--muted)}
.fld small{font-size:11.5px;color:var(--muted)}
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=password],textarea{width:100%;font-family:var(--ui);font-size:16px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:9px 11px;-webkit-appearance:none;appearance:none;min-width:0}
textarea{resize:vertical;line-height:1.6;min-height:74px}
input:focus-visible,textarea:focus-visible,button:focus-visible,.b:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=range]{width:100%;accent-color:var(--accent)}
.sw{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.sw input{width:20px;height:20px;accent-color:var(--accent)}

.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:500;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.b.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.b.pri:disabled{background:#B9BFA8;border-color:#B9BFA8;cursor:default}
.b.sm{padding:5px 9px;font-size:12px;border-radius:7px}
.b.danger{color:var(--danger)}
.b.add{border-style:dashed;color:var(--accent);width:100%}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.list{display:grid;gap:10px}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px;background:var(--soft)}
.item input{background:var(--card)}
.item .tools{display:flex;gap:6px;justify-content:flex-end}

.pslot{display:flex;gap:12px;align-items:center}
.pslot img{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--line);flex:none}
.coverbox{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:start}
@media (max-width:420px){.coverbox{grid-template-columns:104px 1fr;gap:12px}}
.phone{--pw:132px;width:var(--pw);aspect-ratio:9/17.5;border-radius:14px;overflow:hidden;background:var(--line);border:1px solid var(--line)}
.phone img{width:100%;height:100%;object-fit:cover;display:block}
.phone{position:sticky;top:10px;z-index:3;box-shadow:0 6px 18px -8px rgba(47,40,35,.45)}
@media (max-width:420px){.phone{--pw:104px}}
.card{overflow:clip}
.pscr,.plab{position:absolute;left:0;right:0;padding:0 5px;text-align:center;color:#3D332C;pointer-events:none}
.pscr{font-family:"Pinyon Script",cursive;font-size:calc(var(--pw) * .1 * var(--s,1));line-height:1;text-shadow:0 0 5px rgba(255,255,255,.7)}
.plab{font-size:calc(var(--pw) * .028 * var(--s,1));letter-spacing:.34em;text-transform:uppercase;opacity:.78;line-height:1.75}
.bgmbox{display:grid;gap:10px}
.bgmbox audio{width:100%;height:40px}
.ogbox img{width:100%;max-width:300px;aspect-ratio:1200/630;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;background:var(--line)}

.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:560px){.ggrid{grid-template-columns:repeat(4,1fr)}}
.gt{position:relative;border-radius:8px;overflow:hidden;background:var(--line);aspect-ratio:3/4;border:1px solid var(--line)}
.gt img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;user-select:none;-webkit-user-select:none}
.gt .no{position:absolute;left:5px;top:5px;font-size:11px;font-weight:700;background:rgba(47,40,35,.72);color:#fff;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}
.gt .hd{position:absolute;right:4px;top:4px;width:30px;height:30px;border-radius:8px;border:0;background:rgba(255,255,255,.88);font-size:16px;line-height:1;cursor:grab;touch-action:none;padding:0}
.gt .gtools{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:4px;background:linear-gradient(180deg,transparent,rgba(47,40,35,.55))}
.gt .gtools button{width:28px;height:28px;border-radius:7px;border:0;background:rgba(255,255,255,.9);font-size:12px;cursor:pointer;padding:0}
.gt .gtools button:disabled{opacity:.35}
.gt.drag{opacity:.45}
.gt.over{outline:3px solid var(--accent);outline-offset:-3px}
.gt.new::after{content:"새 사진";position:absolute;left:5px;bottom:38px;font-size:10px;font-weight:700;background:var(--accent);color:#fff;padding:1px 6px;border-radius:999px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.bar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar .st{font-size:12.5px;color:var(--muted);min-width:0}
.bar .st.dirty{color:var(--warn);font-weight:500}
.bar .st.ok{color:var(--accent);font-weight:500}

.modal{position:fixed;inset:0;z-index:40;background:rgba(47,40,35,.6);display:grid;place-items:center;padding:16px}
.box{background:var(--card);border-radius:14px;padding:20px;max-width:360px;width:100%;display:grid;gap:10px}
.box b{font-size:15px}
.box ul{margin:0;padding-left:18px;font-size:13px;color:var(--muted);display:grid;gap:3px}
.pvwrap{display:grid;gap:10px;justify-items:center;width:100%}
.pvwrap iframe{display:block;width:min(390px,100%);height:min(780px,calc(100vh - 110px));height:min(780px,calc(100svh - 110px));border:0;border-radius:22px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:10px 16px;border-radius:999px;z-index:60;max-width:calc(100vw - 32px);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>청첩장 관리</h1>
      <div class="links"><a id="lnkSite" target="_blank" rel="noopener">청첩장 열기</a><a id="lnkSheet" target="_blank" rel="noopener" hidden>참석 명단 보기</a></div>
    </div>
    <span class="chip" id="chip">불러오는 중</span>
  </header>
  <main id="app"></main>
</div>

<footer class="bar"><div class="in">
  <span class="st" id="status">불러오는 중…</span>
  <div class="rowbtns"><button type="button" class="b" id="btnPreview" disabled>미리보기</button><button type="button" class="b pri" id="btnSave" disabled>저장</button></div>
</div></footer>

<div class="modal" id="pv" hidden><div class="pvwrap"><div id="pvHolder" style="display:contents"></div><button type="button" class="b" id="pvClose">미리보기 닫기</button></div></div>
<div class="modal" id="busy" hidden><div class="box" role="alertdialog" aria-live="polite"><b id="busyTitle">저장하는 중</b><ul id="busyLog"></ul></div></div>
<input type="file" id="picker" accept="image/*" hidden>

<script>
(function(){
'use strict';

var CFG = {
  owner: 'JJ-HOON', repo: 'wedding', branch: 'main',
  /* commits are recorded with GitHub's anonymous address, never a personal e-mail */
  committer: { name: 'JJ-HOON', email: '356543522+JJ-HOON@users.noreply.github.com' },
  keyStore: 'wedding-admin-key'
};

/* ===== PURE-START : no page access below, so these can be tested on their own ===== */
function str(v){ return v == null ? '' : String(v); }
function num(v, dflt, min, max){ var n = parseFloat(v); if(!isFinite(n)) n = dflt; return Math.max(min, Math.min(max, Math.round(n))); }
function parseContent(text){
  var w = {}; (new Function('window', text))(w);
  if(!w.INVITATION || typeof w.INVITATION !== 'object') throw new Error('content.js 에서 내용을 찾지 못했습니다');
  return w.INVITATION;
}
function normalize(d){
  d = d || {};
  var v = d.venue || {}, w = d.wedding || {}, c = d.cover || {}, g = d.greeting || {}, ga = d.gallery || {}, r = d.rsvp || {}, f = r.form || {}, a = d.accounts || {}, s = d.share || {}, e = d.closing || {}, en = d.entry || {};
  function person(p){ p = p || {}; return { name: str(p.name), givenName: str(p.givenName), father: str(p.father), mother: str(p.mother), relation: str(p.relation), intro: str(p.intro), photo: str(p.photo) }; }
  function accs(list){ return (Array.isArray(list) ? list : []).map(function(x){ x = x || {}; return { who: str(x.who), bank: str(x.bank), number: str(x.number) }; }); }
  var st = Array.isArray(v.stations) ? v.stations : [];
  return {
    siteUrl: str(d.siteUrl),
    groom: person(d.groom), bride: person(d.bride),
    wedding: { date: str(w.date), time: str(w.time) },
    venue: { name: str(v.name), city: str(v.city), hall: str(v.hall), address: str(v.address), tel: str(v.tel), mapSearch: str(v.mapSearch), stations: [str(st[0]), str(st[1])] },
    transport: (Array.isArray(d.transport) ? d.transport : []).map(function(t){ t = t || {}; return { label: str(t.label), text: str(t.text), note: str(t.note) }; }),
    cover: { photo: str(c.photo), lettering: str(c.lettering), label: str(c.label), focus: str(c.focus) || '50% 50%',
      textY: num(c.textY, 8, 0, 92), textX: num(c.textX, 0, -40, 40), textSize: num(c.textSize, 100, 50, 200),
      labelY: num(c.labelY, num(c.textY, 8, 0, 92) + 6, 0, 92), labelX: num(c.labelX, num(c.textX, 0, -40, 40), -40, 40), labelSize: num(c.labelSize, 100, 50, 300) },
    entry: { show: en.show !== false, message: str(en.message) || '결혼식에 초대합니다' },
    greeting: { title: str(g.title), quote: str(g.quote), quoteSource: str(g.quoteSource), message: str(g.message) },
    gallery: { title: str(ga.title), photos: (Array.isArray(ga.photos) ? ga.photos : []).map(str).filter(Boolean) },
    rsvp: { show: r.show !== false, title: str(r.title), message: str(r.message), form: { id: str(f.id), name: str(f.name), side: str(f.side), attend: str(f.attend), count: str(f.count) }, sheetUrl: str(r.sheetUrl) },
    accounts: { title: str(a.title), groomSide: accs(a.groomSide), brideSide: accs(a.brideSide) },
    share: { title: str(s.title), description: str(s.description) },
    bgm: str(d.bgm),
    bgmDelay: Math.max(0, Math.min(30, parseFloat(d.bgmDelay) || 0)),
    closing: { lettering: str(e.lettering), message: str(e.message) }
  };
}
function sameContent(a, b){ return JSON.stringify(normalize(a)) === JSON.stringify(normalize(b)); }
function q(s){ return JSON.stringify(str(s)); }
function tq(s){ return '`' + str(s).replace(/\r\n?/g, '\n').replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$\{/g, '\\${') + '`'; }
function serializeContent(data){
  var d = normalize(data), L = [];
  function person(key, title, p, relHint){
    L.push('  /* ── ' + title + ' ─────────────────────────────────────────────────── */');
    L.push('  ' + key + ': {');
    L.push('    name: ' + q(p.name) + ',');
    L.push('    givenName: ' + q(p.givenName) + ',          // 이름만 (남은 날짜 문구에 쓰입니다)');
    L.push('    father: ' + q(p.father) + ',');
    L.push('    mother: ' + q(p.mother) + ',');
    L.push('    relation: ' + q(p.relation) + ',            // ' + relHint);
    L.push('    intro: ' + tq(p.intro) + ',');
    L.push('    photo: ' + q(p.photo) + ',');
    L.push('  },');
    L.push('');
  }
  function accs(key, list){
    L.push('    ' + key + ': [');
    list.forEach(function(x){ L.push('      { who: ' + q(x.who) + ', bank: ' + q(x.bank) + ', number: ' + q(x.number) + ' },'); });
    L.push('    ],');
  }
  L.push('/* ================================================================');
  L.push('   청첩장 내용 파일 ― 이 파일의 내용이 청첩장에 그대로 나타납니다');
  L.push('   ----------------------------------------------------------------');
  L.push('   보통은 관리자 화면(주소 뒤에 admin/)에서 고칩니다.');
  L.push('   직접 고칠 때는 따옴표 " " 나 백틱 ` ` 안의 글자만 바꾸고,');
  L.push('   따옴표와 줄 끝의 쉼표(,)는 그대로 둡니다.');
  L.push('   ================================================================ */');
  L.push('');
  L.push('window.INVITATION = {');
  L.push('');
  L.push('  /* ── 청첩장 주소 (공유 버튼과 QR에 쓰입니다. 바꾸지 마세요) ── */');
  L.push('  siteUrl: ' + q(d.siteUrl) + ',');
  L.push('');
  person('groom', '신랑', d.groom, '장남 · 차남 · 아들');
  person('bride', '신부', d.bride, '장녀 · 차녀 · 딸');
  L.push('  /* ── 예식 일시 (날짜만 바꾸면 달력과 남은 날짜가 자동으로 바뀝니다) ── */');
  L.push('  wedding: {');
  L.push('    date: ' + q(d.wedding.date) + ',             // 년-월-일');
  L.push('    time: ' + q(d.wedding.time) + ',                  // 24시간제');
  L.push('  },');
  L.push('');
  L.push('  /* ── 예식장 ───────────────────────────────────────────────── */');
  L.push('  venue: {');
  L.push('    name: ' + q(d.venue.name) + ',');
  L.push('    city: ' + q(d.venue.city) + ',');
  L.push('    hall: ' + q(d.venue.hall) + ',                       // 홀 이름과 층. 비워 두면 표시하지 않습니다');
  L.push('    address: ' + q(d.venue.address) + ',');
  L.push('    tel: ' + q(d.venue.tel) + ',');
  L.push('    mapSearch: ' + q(d.venue.mapSearch) + ',  // 지도 버튼을 눌렀을 때 검색할 말');
  L.push('    stations: [' + q(d.venue.stations[0]) + ', ' + q(d.venue.stations[1]) + '],   // 약도 왼쪽과 오른쪽에 표시할 역');
  L.push('  },');
  L.push('');
  L.push('  /* ── 오시는 길 ────────────────────────────────────────────── */');
  L.push('  transport: [');
  d.transport.forEach(function(t){ L.push('    { label: ' + q(t.label) + ', text: ' + q(t.text) + ', note: ' + q(t.note) + ' },'); });
  L.push('  ],');
  L.push('');
  L.push('  /* ── 첫 화면 ──────────────────────────────────────────────── */');
  L.push('  cover: {');
  L.push('    photo: ' + q(d.cover.photo) + ',');
  L.push('    lettering: ' + q(d.cover.lettering) + ',');
  L.push('    label: ' + q(d.cover.label) + ',');
  L.push('    focus: ' + q(d.cover.focus) + ',             // 사진이 잘릴 때의 중심점 "가로% 세로%"');
  L.push('    textY: ' + d.cover.textY + ',                    // 필기체 문구: 위아래 위치 (화면 위에서부터 %)');
  L.push('    textX: ' + d.cover.textX + ',                    // 필기체 문구: 좌우 위치 (0 = 가운데, 빼기 = 왼쪽, 더하기 = 오른쪽)');
  L.push('    textSize: ' + d.cover.textSize + ',               // 필기체 문구: 크기 (100 = 기본)');
  L.push('    labelY: ' + d.cover.labelY + ',                  // 작은 영문 표시: 위아래 위치');
  L.push('    labelX: ' + d.cover.labelX + ',                   // 작은 영문 표시: 좌우 위치');
  L.push('    labelSize: ' + d.cover.labelSize + ',              // 작은 영문 표시: 크기 (100 = 기본)');
  L.push('  },');
  L.push('');
  L.push('  /* ── 입장 화면 (청첩장을 열면 먼저 보이는 카메라 화면. 셔터를 누르면 열립니다) ── */');
  L.push('  entry: {');
  L.push('    show: ' + (d.entry.show ? 'true' : 'false') + ',');
  L.push('    message: ' + q(d.entry.message) + ',          // 이름 아래 작은 문구');
  L.push('  },');
  L.push('');
  L.push('  /* ── 인사말 ───────────────────────────────────────────────── */');
  L.push('  greeting: {');
  L.push('    title: ' + q(d.greeting.title) + ',');
  L.push('    quote: ' + tq(d.greeting.quote) + ',');
  L.push('    quoteSource: ' + q(d.greeting.quoteSource) + ',');
  L.push('    message: ' + tq(d.greeting.message) + ',');
  L.push('  },');
  L.push('');
  L.push('  /* ── 갤러리 (위에서부터 순서대로 필름에 들어갑니다) ───────── */');
  L.push('  gallery: {');

/* ---------- save ---------- */
function logStep(text){ $('busyLog').appendChild(h('li', '', text)); }
function save(){
  if(S.saving || !S.data) return;
  if(S.readOnly){ toast('저장하려면 먼저 열쇠를 넣어 주세요'); var k = document.querySelector('.card'); if(k){ k.open = true; k.scrollIntoView({ block: 'start' }); } return; }
  var data = normalize(S.data), text = serializeContent(data), used = usedPhotos(data), uploads = unsavedPhotos();
  var nMusic = uploads.filter(function(p){ return /^music\//.test(p); }).length, nPhoto = uploads.length - nMusic;
  try{ if(!sameContent(parseContent(text), data)) throw new Error('x'); }catch(e){ alert('내용을 파일로 바꾸는 검사에서 문제가 생겨 저장을 멈췄습니다. 아무것도 바뀌지 않았습니다.'); return; }
  if(!data.cover.photo){ alert('대표 사진이 비어 있어 저장을 멈췄습니다.'); return; }
  if(!confirm('청첩장에 반영할까요?' + (nPhoto ? '\n새 사진 ' + nPhoto + '장을 함께 올립니다.' : '') + (nMusic ? '\n새 배경음악을 함께 올립니다.' : '') + '\n저장 후 1~2분 뒤 실제 주소에 나타납니다.')) return;
  S.saving = true; S.liveNote = ''; refreshBar(); $('busyLog').textContent = ''; $('busyTitle').textContent = '저장하는 중'; $('busy').hidden = false;
  var headSha, treeSha, entries = [], removed = 0;
  logStep('현재 상태 확인');
  api('/git/ref/heads/' + CFG.branch).then(function(ref){
    headSha = ref.object.sha;
    if(S.head && headSha !== S.head) throw new ApiError(409, 'head moved');
    return api('/git/commits/' + headSha);
  }).then(function(commit){
    treeSha = commit.tree.sha; return api('/git/trees/' + treeSha + '?recursive=1');
  }).then(function(tree){
    (tree.tree || []).forEach(function(t){ if(t.type === 'blob' && /^(photos|music)\//.test(t.path) && !used[t.path]){ entries.push({ path: t.path, mode: '100644', type: 'blob', sha: null }); removed++; } });
    if(nPhoto) logStep('사진 ' + nPhoto + '장 올리기'); if(nMusic) logStep('배경음악 올리기');
    return uploads.reduce(function(chain, p){ return chain.then(function(){ return blobBase64(S.pending[p].blob).then(function(b64){ return api('/git/blobs', { method: 'POST', body: { content: b64, encoding: 'base64' } }); }).then(function(blob){ entries.push({ path: p, mode: '100644', type: 'blob', sha: blob.sha }); }); }); }, Promise.resolve());
  }).then(function(){
    return api('/contents/index.html?ref=' + headSha, { raw: true });
  }).then(function(html){
    var next = updateIndexHtml(html, data);
    if(next !== html) entries.push({ path: 'index.html', mode: '100644', type: 'blob', content: next });
    entries.push({ path: 'content.js', mode: '100644', type: 'blob', content: text });
    logStep('변경 내용 기록');
    return api('/git/trees', { method: 'POST', body: { base_tree: treeSha, tree: entries } });
  }).then(function(tree){
    return api('/git/commits', { method: 'POST', body: { message: '관리자 화면에서 수정' + (nPhoto ? ' (사진 ' + nPhoto + '장 추가)' : '') + (nMusic ? ' (배경음악 변경)' : '') + (removed ? ' (파일 ' + removed + '개 정리)' : ''), tree: tree.sha, parents: [headSha], author: CFG.committer, committer: CFG.committer } });
  }).then(function(commit){
    return api('/git/refs/heads/' + CFG.branch, { method: 'PATCH', body: { sha: commit.sha } }).then(function(){ return commit.sha; });
  }).then(function(sha){
    S.head = sha; S.base = text; uploads.forEach(function(p){ S.pending[p].saved = true; });
    S.saving = false; $('busy').hidden = true; S.liveNote = '저장됨 · 실제 주소에 반영되는 중 (1~2분)'; render(); refreshBar();
    watchLive(text);
  }).catch(function(e){
    S.saving = false; $('busy').hidden = true; refreshBar();
    alert('저장하지 못했습니다.\n' + explain(e) + '\n\n청첩장은 이전 상태 그대로입니다.');
  });
}
function watchLive(text){
  var tries = 0;
  (function tick(){
    if(S.base !== text) return;
    fetch('../content.js?v=' + Date.now(), { cache: 'no-store' }).then(function(r){ return r.ok ? r.text() : ''; }).then(function(t){
      if(S.base !== text) return;
      if(t === text){ S.liveNote = '저장됨 · 실제 주소에 반영 완료'; refreshBar(); }
      else if(++tries < 30) setTimeout(tick, 8000);
      else { S.liveNote = '저장됨 · 반영이 늦어지고 있습니다. 잠시 뒤 청첩장을 열어 확인해 주세요'; refreshBar(); }
    }, function(){ if(++tries < 30) setTimeout(tick, 8000); });
  })();
}
$('btnSave').addEventListener('click', save);
window.addEventListener('beforeunload', function(e){ if(isDirty()){ e.preventDefault(); e.returnValue = ''; } });

/* ---------- load ---------- */
function adopt(text, head){ S.data = normalize(parseContent(text)); S.base = serializeContent(S.data); S.head = head || ''; S.pending = {}; S.liveNote = ''; render(); refreshBar(); }
function loadPublic(){ return fetch('../content.js?v=' + Date.now(), { cache: 'no-store' }).then(function(r){ if(!r.ok) throw new Error('content.js 를 불러오지 못했습니다'); return r.text(); }).then(function(t){ adopt(t, ''); }); }
function loadRepo(){ var head; return api('/git/ref/heads/' + CFG.branch).then(function(ref){ head = ref.object.sha; return api('/contents/content.js?ref=' + head, { raw: true }); }).then(function(t){ adopt(t, head); }); }
function connect(token){
  var prev = S.token; S.token = token; $('chip').textContent = '연결 확인 중';
  return api('').then(function(){
    S.readOnly = false; try{ localStorage.setItem(CFG.keyStore, token); }catch(e){}
    if(!isDirty()) return loadRepo();
    var head;
    return api('/git/ref/heads/' + CFG.branch).then(function(ref){ head = ref.object.sha; return api('/contents/content.js?ref=' + head, { raw: true }); }).then(function(t){
      var repoBase = serializeContent(parseContent(t));
      if(repoBase !== S.base && confirm('저장소의 최신 내용이 지금 화면과 다릅니다.\n최신 내용을 불러올까요? 방금 고친 내용은 사라집니다.\n\n취소를 누르면 지금 고친 내용을 그대로 둡니다.')){ adopt(t, head); return; }
      S.head = head; S.base = repoBase; render(); refreshBar();
    });
  }).then(function(){ toast('연결되었습니다'); }, function(e){ S.token = prev; S.readOnly = !prev; refreshBar(); alert('연결하지 못했습니다.\n' + explain(e)); });
}
function boot(){
  var saved = ''; try{ saved = localStorage.getItem(CFG.keyStore) || ''; }catch(e){}
  var start = saved ? (S.token = saved, api('').then(function(){ S.readOnly = false; return loadRepo(); }).catch(function(e){ S.token = ''; S.readOnly = true; return loadPublic().then(function(){ toast(explain(e)); }); })) : loadPublic();
  start.catch(function(e){ $('app').textContent = ''; $('app').appendChild(h('div', 'note warn', '내용을 불러오지 못했습니다. ' + explain(e))); $('chip').className = 'chip bad'; $('chip').textContent = '오류'; $('status').textContent = '불러오지 못함'; });
}
if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) window.__admin = { S: S, serializeContent: serializeContent, parseContent: parseContent, normalize: normalize, sameContent: sameContent, updateIndexHtml: updateIndexHtml, usedPhotos: usedPhotos, addPending: addPending, render: render, refreshBar: refreshBar, isDirty: isDirty, makeOg: makeOg, resizeFile: resizeFile, save: save };
boot();
})();
</script>
